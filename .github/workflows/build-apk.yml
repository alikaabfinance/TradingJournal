
name: Build Android APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'JournalAPK_Project.zip'
      - '.github/workflows/build-apk.yml'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Unzip Android project
        run: |
          if [ ! -f JournalAPK_Project.zip ]; then
            echo "ERROR: Please upload JournalAPK_Project.zip to the repository root."
            exit 1
          fi
          mkdir project
          unzip -q JournalAPK_Project.zip -d project
          ROOT="$(find project -name settings.gradle.kts -printf '%h\n' | head -n 1)"
          if [ -z "$ROOT" ]; then
            echo "ERROR: settings.gradle.kts not found in ZIP."
            find project -maxdepth 3 -type f | head -n 50
            exit 1
          fi
          echo "PROJECT_ROOT=$ROOT" >> "$GITHUB_ENV"

      - name: Build debug APK
        run: |
          cd "$PROJECT_ROOT"
          chmod +x gradlew 2>/dev/null || true
          if [ -f gradlew ]; then
            ./gradlew assembleDebug
          else
            echo "ERROR: gradlew is missing from the project ZIP."
            exit 1
          fi

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: TradingJournal-APK
          path: project/**/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
